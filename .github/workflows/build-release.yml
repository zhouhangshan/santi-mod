name: Build and Release from Source Zip

on:
  push:
    branches: [main]
    paths:
      - 'santi-coord-broadcaster-src.zip'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip to repo root
        id: extract
        run: |
          set -e
          ZIP="santi-coord-broadcaster-src.zip"
          TMP=$(mktemp -d)
          unzip -q -o "$ZIP" -d "$TMP"

          # 如果解压后只有一个顶层目录，且其中有 build.gradle，则把它作为源码根
          ENTRIES=$(find "$TMP" -mindepth 1 -maxdepth 1 | wc -l)
          SRC="$TMP"
          if [ "$ENTRIES" -eq 1 ]; then
            TOP=$(find "$TMP" -mindepth 1 -maxdepth 1)
            if [ -d "$TOP" ] && { [ -f "$TOP/build.gradle" ] || [ -f "$TOP/build.gradle.kts" ]; }; then
              SRC="$TOP"
            fi
          fi

          # 复制到仓库根目录（覆盖同名文件，隐藏文件也包含）
          cp -r "$SRC"/. .

          # 从 gradle.properties 读取版本号
          VERSION=""
          if [ -f gradle.properties ]; then
            VERSION=$(grep -E '^mod_version\s*=' gradle.properties | head -n1 | cut -d= -f2 | tr -d ' \r')
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Commit extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: extract sources from zip [skip ci]"
            git push
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: v${{ steps.extract.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
