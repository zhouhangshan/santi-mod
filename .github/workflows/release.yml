name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon
      - name: Upload jar to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
